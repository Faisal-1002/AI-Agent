# seyl-ai's login pages: Keycloak's own theme (keycloak.v2) with the app's look on top —
# the same design as the chat UI (LibreChat's). Enabled per realm by scripts/auth-setup.ts.
parent=keycloak.v2
# Keep keycloak.v2's stylesheet, then ours (css/styles.css resolves to the parent's file).
styles=css/styles.css css/seyl.css
