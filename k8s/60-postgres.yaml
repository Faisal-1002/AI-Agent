# Postgres with pgvector: the gateway's keys and logs (database "litellm"), and Ai-Agent's
# documents and their vectors (database "ai_agent", own user — created by npm run db:setup).
# One replica with a persistent volume — a real deployment would use a managed
# database instead (on AWS: Amazon RDS / Aurora).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: gateway-db
  namespace: ai-agent
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: db
  namespace: ai-agent
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels: { app: db }
  template:
    metadata:
      labels: { app: db }
    spec:
      containers:
        - name: postgres
          image: pgvector/pgvector:0.8.6-pg16-trixie # Postgres 16 + pgvector 0.8.6, on the SAME Debian (trixie) that created the data — see README
          env:
            - name: POSTGRES_DB
              value: litellm
            - name: POSTGRES_USER
              value: litellm
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: { name: ai-agent-secrets, key: POSTGRES_PASSWORD }
            - name: PGDATA # a subfolder: the volume's root may contain lost+found
              value: /var/lib/postgresql/data/pgdata
          ports:
            - containerPort: 5432
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "litellm", "-d", "litellm"]
            periodSeconds: 5
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { memory: 512Mi }
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: gateway-db
---
apiVersion: v1
kind: Service
metadata:
  name: db
  namespace: ai-agent
spec:
  selector: { app: db }
  ports:
    - port: 5432
      targetPort: 5432
