# The OpenCode harness. Stateful: it stores sessions on disk, so it runs as ONE
# replica with a persistent volume (scaling it needs shared storage — a later lesson).

# PersistentVolumeClaim = "I need 1 GiB of disk that survives pod restarts".
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: opencode-data
  namespace: seyl-ai
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi
---
# Deployment = "keep N copies of this container running; replace them if they die".
apiVersion: apps/v1
kind: Deployment
metadata:
  name: harness
  namespace: seyl-ai
spec:
  replicas: 1
  strategy:
    type: Recreate # stop the old pod before starting the new one (they can't share the disk)
  selector:
    matchLabels: { app: harness }
  template:
    metadata:
      labels: { app: harness }
    spec:
      securityContext:
        fsGroup: 1000 # the volume is writable by the "node" user (uid 1000)
      # The agent can now edit files (with the user's approval), so the workspace lives on the
      # persistent volume. On first start it's empty: copy the image's starter files in.
      # cp -n never overwrites, so the user's edits survive every restart and upgrade.
      initContainers:
        - name: seed-workspace
          image: seyl-ai/app:dev
          imagePullPolicy: IfNotPresent
          command: ["sh", "-c", "cp -rn /workspace-seed/. /workspace/"]
          volumeMounts:
            - name: data
              mountPath: /workspace
              subPath: workspace
      containers:
        - name: harness
          image: seyl-ai/app:dev
          imagePullPolicy: IfNotPresent # use the locally built image
          command: ["node", "--import", "tsx", "server/harness.ts"]
          env:
            - name: LLM_GATEWAY_URL # all model calls go through the gateway
              value: http://litellm:4000
            - name: LITELLM_KEY_HARNESS # this pod's own key: chat models only
              valueFrom:
                secretKeyRef: { name: seyl-secrets, key: LITELLM_KEY_HARNESS }
            - name: SEYL_MCP_URL # the api's MCP tool server (document tools) — its own port
              value: http://api:3001/mcp
            - name: SEYL_MCP_TOKEN
              valueFrom:
                secretKeyRef: { name: seyl-secrets, key: SEYL_MCP_TOKEN }
          ports:
            - containerPort: 4097
          volumeMounts:
            - name: data
              mountPath: /data
            - name: data # the same volume, its "workspace" folder
              mountPath: /workspace
              subPath: workspace
          readinessProbe: # only send traffic once OpenCode is listening
            tcpSocket: { port: 4097 }
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe: # restart the container if it stops responding
            tcpSocket: { port: 4097 }
            initialDelaySeconds: 60
            periodSeconds: 20
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { memory: 1Gi }
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: opencode-data
---
# Service = a stable name + address for the pods. Other pods reach it at http://harness:4097.
# ClusterIP (the default) means: reachable only from inside the cluster.
apiVersion: v1
kind: Service
metadata:
  name: harness
  namespace: seyl-ai
spec:
  selector: { app: harness }
  ports:
    - port: 4097
      targetPort: 4097
