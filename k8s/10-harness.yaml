# The OpenCode harness. Stateful: it stores sessions on disk, so it runs as ONE
# replica with a persistent volume (scaling it needs shared storage — a later lesson).

# PersistentVolumeClaim = "I need 1 GiB of disk that survives pod restarts".
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: opencode-data
  namespace: ai-agent
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi
---
# Deployment = "keep N copies of this container running; replace them if they die".
apiVersion: apps/v1
kind: Deployment
metadata:
  name: harness
  namespace: ai-agent
spec:
  replicas: 1
  strategy:
    type: Recreate # stop the old pod before starting the new one (they can't share the disk)
  selector:
    matchLabels: { app: harness }
  template:
    metadata:
      labels: { app: harness }
    spec:
      securityContext:
        fsGroup: 1000 # the volume is writable by the "node" user (uid 1000)
      # Every user's files live on this persistent volume, one folder per space (/data/workspaces,
      # created by server/harness.ts). /workspace is the old shared folder from before spaces:
      # conversations from back then still point there. On first start it gets the starter files;
      # cp -n never overwrites, so edits survive every restart and upgrade.
      initContainers:
        - name: seed-workspace
          image: ai-agent/app:dev
          imagePullPolicy: IfNotPresent
          command: ["sh", "-c", "cp -rn /workspace-seed/. /workspace/"]
          volumeMounts:
            - name: data
              mountPath: /workspace
              subPath: workspace
      containers:
        - name: harness
          image: ai-agent/app:dev
          imagePullPolicy: IfNotPresent # use the locally built image
          command: ["node", "--import", "tsx", "server/harness.ts"]
          env:
            - name: LLM_GATEWAY_URL # all model calls go through the gateway
              value: http://litellm:4000
            - name: LITELLM_KEY_HARNESS # this pod's own key: chat models only
              valueFrom:
                secretKeyRef: { name: ai-agent-secrets, key: LITELLM_KEY_HARNESS }
            - name: AI_AGENT_DOCS_URL # the agent's document tools call the api here — its internal port
              value: http://api:3001/internal/docs
            - name: AI_AGENT_MCP_TOKEN
              valueFrom:
                secretKeyRef: { name: ai-agent-secrets, key: AI_AGENT_MCP_TOKEN }
            - name: OPENCODE_SERVER_PASSWORD # OpenCode requires it on every request; only the api has it
              valueFrom:
                secretKeyRef: { name: ai-agent-secrets, key: OPENCODE_SERVER_PASSWORD }
          ports:
            - containerPort: 4097 # OpenCode
            - containerPort: 4098 # admin: creates the spaces' folders (same password)
          volumeMounts:
            - name: data
              mountPath: /data
            - name: data # the same volume, its "workspace" folder
              mountPath: /workspace
              subPath: workspace
          readinessProbe: # only send traffic once OpenCode is listening
            tcpSocket: { port: 4097 }
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe: # restart the container if it stops responding
            tcpSocket: { port: 4097 }
            initialDelaySeconds: 60
            periodSeconds: 20
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { memory: 1Gi }
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: opencode-data
---
# Service = a stable name + address for the pods. Other pods reach it at http://harness:4097
# (and the admin port at http://harness:4098).
# ClusterIP (the default) means: reachable only from inside the cluster.
apiVersion: v1
kind: Service
metadata:
  name: harness
  namespace: ai-agent
spec:
  selector: { app: harness }
  ports:
    - name: opencode
      port: 4097
      targetPort: 4097
    - name: admin
      port: 4098
      targetPort: 4098
