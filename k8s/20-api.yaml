# The seyl-ai backend. Stateless (all chat state lives in the harness), so it can
# run several replicas — the Service spreads requests across them.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: seyl-ai
spec:
  replicas: 2
  selector:
    matchLabels: { app: api }
  template:
    metadata:
      labels: { app: api }
    spec:
      containers:
        - name: api
          image: seyl-ai/app:dev
          imagePullPolicy: IfNotPresent
          env:
            - name: OPENCODE_URL
              value: http://harness:4097
          ports:
            - containerPort: 3000
          readinessProbe:
            httpGet: { path: /api/readyz, port: 3000 }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /api/healthz, port: 3000 }
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { memory: 512Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: seyl-ai
spec:
  selector: { app: api }
  ports:
    - port: 3000
      targetPort: 3000
