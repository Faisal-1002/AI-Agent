# The seyl-ai backend. Stateless (all chat state lives in the harness), so it can
# run several replicas — the Service spreads requests across them.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: seyl-ai
spec:
  replicas: 2
  selector:
    matchLabels: { app: api }
  template:
    metadata:
      labels: { app: api }
    spec:
      containers:
        - name: api
          image: seyl-ai/app:dev
          imagePullPolicy: IfNotPresent
          env:
            - name: OPENCODE_URL
              value: http://harness:4097
            - name: LLM_GATEWAY_URL # voice goes through the gateway too
              value: http://litellm:4000
            - name: LITELLM_KEY_API # this pod's own key: guard, voice and embedding models only
              valueFrom:
                secretKeyRef: { name: seyl-secrets, key: LITELLM_KEY_API }
            - name: LITELLM_ADMIN_KEY # creates/revokes per-device gateway keys (server/devices.ts)
              valueFrom:
                secretKeyRef: { name: seyl-secrets, key: LITELLM_MASTER_KEY }
            - name: SEYL_DB_HOST # seyl-ai's own database (documents + vectors)
              value: db
            - name: SEYL_DB_PASSWORD
              valueFrom:
                secretKeyRef: { name: seyl-secrets, key: SEYL_DB_PASSWORD }
            - name: SEYL_MCP_TOKEN # the harness must present this to use /mcp
              valueFrom:
                secretKeyRef: { name: seyl-secrets, key: SEYL_MCP_TOKEN }
            # Login (OIDC with Keycloak, server/auth.ts)
            - name: AUTH_ENABLED
              value: "true"
            - name: SEYL_PUBLIC_URL # where browsers reach the app
              value: http://localhost:8080
            - name: OIDC_INTERNAL_ISSUER # how the api reaches Keycloak inside the cluster
              value: http://keycloak:8080/auth/realms/seyl
            - name: OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef: { name: seyl-secrets, key: OIDC_CLIENT_SECRET }
            - name: SEYL_SESSION_SECRET
              valueFrom:
                secretKeyRef: { name: seyl-secrets, key: SEYL_SESSION_SECRET }
          ports:
            - containerPort: 3000
            - containerPort: 3001 # MCP tool server: for the harness only (nginx never forwards it)
              name: mcp
          # Zero-downtime rollouts: when a pod is told to stop, the load balancer
          # needs a few seconds to stop sending it traffic. Wait before SIGTERM,
          # otherwise requests in that window get a 502.
          lifecycle:
            preStop:
              sleep: { seconds: 5 }
          # Readiness = "can THIS pod serve?" — deliberately NOT "is the harness up?".
          # If it checked the harness, a harness restart would mark every api pod
          # unready and take down even requests that don't need the harness.
          readinessProbe:
            httpGet: { path: /api/healthz, port: 3000 }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /api/healthz, port: 3000 }
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { memory: 512Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: seyl-ai
spec:
  selector: { app: api }
  ports:
    - port: 3000
      targetPort: 3000
      name: http
    - port: 3001
      targetPort: 3001
      name: mcp
