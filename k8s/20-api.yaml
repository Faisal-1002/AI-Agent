# The seyl-ai backend. Stateless (all chat state lives in the harness), so it can
# run several replicas — the Service spreads requests across them.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: seyl-ai
spec:
  replicas: 2
  selector:
    matchLabels: { app: api }
  template:
    metadata:
      labels: { app: api }
    spec:
      containers:
        - name: api
          image: seyl-ai/app:dev
          imagePullPolicy: IfNotPresent
          env:
            - name: OPENCODE_URL
              value: http://harness:4097
            - name: ASR_URL
              value: http://asr:8000
            - name: TTS_URL
              value: http://tts:8000
          ports:
            - containerPort: 3000
          # Zero-downtime rollouts: when a pod is told to stop, the load balancer
          # needs a few seconds to stop sending it traffic. Wait before SIGTERM,
          # otherwise requests in that window get a 502.
          lifecycle:
            preStop:
              sleep: { seconds: 5 }
          # Readiness = "can THIS pod serve?" — deliberately NOT "is the harness up?".
          # If it checked the harness, a harness restart would mark every api pod
          # unready and take down even requests that don't need the harness.
          readinessProbe:
            httpGet: { path: /api/healthz, port: 3000 }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /api/healthz, port: 3000 }
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { memory: 512Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: seyl-ai
spec:
  selector: { app: api }
  ports:
    - port: 3000
      targetPort: 3000
