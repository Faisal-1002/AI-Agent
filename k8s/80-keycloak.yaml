# Keycloak: the identity provider (login page, users, OIDC tokens). Standard OIDC, so the
# app would work the same with Amazon Cognito, Entra ID, Okta, Auth0, …
#
# Browsers reach it through nginx at http://localhost:8080/auth (same origin as the app).
# The api talks to it directly at http://keycloak:8080/auth (the "back channel").
apiVersion: apps/v1
kind: Deployment
metadata:
  name: keycloak
  namespace: seyl-ai
spec:
  replicas: 1
  selector:
    matchLabels: { app: keycloak }
  template:
    metadata:
      labels: { app: keycloak }
    spec:
      containers:
        - name: keycloak
          image: quay.io/keycloak/keycloak:26.7.5
          # start-dev: plain HTTP and relaxed checks — fine on localhost, NOT for production
          # (production: `start` with TLS and a real hostname).
          args: ["start-dev"]
          env:
            - name: KC_BOOTSTRAP_ADMIN_USERNAME
              value: admin
            - name: KC_BOOTSTRAP_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef: { name: seyl-secrets, key: KEYCLOAK_ADMIN_PASSWORD }
            - name: KC_DB
              value: postgres
            - name: KC_DB_URL
              value: jdbc:postgresql://db:5432/keycloak
            - name: KC_DB_USERNAME
              value: keycloak
            - name: KC_DB_PASSWORD
              valueFrom:
                secretKeyRef: { name: seyl-secrets, key: KEYCLOAK_DB_PASSWORD }
            # The public address. Tokens say "issued by http://localhost:8080/auth/realms/seyl",
            # no matter whether the browser or the api is talking to Keycloak.
            - name: KC_HOSTNAME
              value: http://localhost:8080/auth
            - name: KC_HOSTNAME_BACKCHANNEL_DYNAMIC # server-to-server calls may use keycloak:8080
              value: "true"
            - name: KC_HTTP_RELATIVE_PATH
              value: /auth
            - name: KC_PROXY_HEADERS # it sits behind nginx
              value: xforwarded
            - name: KC_HEALTH_ENABLED
              value: "true"
          ports:
            - containerPort: 8080
            - containerPort: 9000 # management: health checks
          startupProbe: # first start creates its database tables
            httpGet: { path: /auth/health/started, port: 9000 }
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet: { path: /auth/health/ready, port: 9000 }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /auth/health/live, port: 9000 }
            periodSeconds: 30
          resources:
            requests: { cpu: 100m, memory: 768Mi }
            limits: { memory: 1536Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: keycloak
  namespace: seyl-ai
spec:
  selector: { app: keycloak }
  ports:
    - port: 8080
      targetPort: 8080
