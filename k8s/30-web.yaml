# The UI (nginx). It's the only thing exposed outside the cluster.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: seyl-ai
spec:
  replicas: 2
  selector:
    matchLabels: { app: web }
  template:
    metadata:
      labels: { app: web }
    spec:
      containers:
        - name: web
          image: seyl-ai/web:dev
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet: { path: /, port: 80 }
            periodSeconds: 5
          resources:
            requests: { cpu: 20m, memory: 32Mi }
            limits: { memory: 128Mi }
---
# LoadBalancer = "give this a public address". Docker Desktop maps it to localhost:8080;
# on AWS the same kind of Service would create a real load balancer.
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: seyl-ai
spec:
  type: LoadBalancer
  selector: { app: web }
  ports:
    - port: 8080
      targetPort: 80
