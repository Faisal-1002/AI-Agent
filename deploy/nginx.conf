# Serves the UI and forwards /api to the backend — the job Vite's dev proxy does locally.
# "api" is the backend's name in both Docker Compose and Kubernetes (a Service called api).
server {
  listen 80;
  root /usr/share/nginx/html;

  client_max_body_size 25m; # document uploads (20 MB limit in the api) and voice recordings

  location /api/ {
    proxy_pass http://api:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

    # Live events (Server-Sent Events): pass bytes through immediately, keep the stream open.
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 1h;
  }

  # Keycloak's pages (login screen) and OIDC endpoints, on the same origin as the app.
  location /auth/ {
    proxy_pass http://keycloak:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_buffer_size 128k; # Keycloak sends large headers (cookies)
    proxy_buffers 4 256k;
  }

  # Hashed build assets never change: cache them for a long time.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  # Single-page app: unknown paths get index.html.
  location / {
    try_files $uri /index.html;
  }
}
