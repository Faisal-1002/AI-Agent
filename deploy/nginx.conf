# Serves the UI and forwards /api to the backend — the job Vite's dev proxy does locally.
# "api" is the backend's name in both Docker Compose and Kubernetes (a Service called api).
server {
  listen 80;
  root /usr/share/nginx/html;

  location /api/ {
    proxy_pass http://api:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

    # Live events (Server-Sent Events): pass bytes through immediately, keep the stream open.
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 1h;
  }

  # Hashed build assets never change: cache them for a long time.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  # Single-page app: unknown paths get index.html.
  location / {
    try_files $uri /index.html;
  }
}
