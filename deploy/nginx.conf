# Serves the UI and forwards /api to the backend — the job Vite's dev proxy does locally.
# "api" is the backend's name in both Docker Compose and Kubernetes (a Service called api).

# Requests for any other host name get no answer: a visit by the PC's network address, or a
# DNS-rebinding page (evil.example resolving to 127.0.0.1). This is NOT a network boundary —
# a client can send "Host: localhost" from anywhere. What keeps other devices out is where the
# port is published: Compose binds 127.0.0.1 only; Docker Desktop's Kubernetes LoadBalancer
# listens on every interface, so there it's up to the Windows firewall (see README, Login).
server {
  listen 80 default_server;
  return 444;
}

server {
  listen 80;
  server_name localhost 127.0.0.1;
  root /usr/share/nginx/html;

  client_max_body_size 25m; # document uploads (20 MB limit in the api) and voice recordings

  # A backslash has no business in our URLs, but Node reads "\" as "/": "/api/..\x" would
  # reach the api as "/x", past nginx's routing. Refuse them (also percent-encoded).
  if ($request_uri ~* "\x5c|%5c") {
    return 400;
  }

  location /api/ {
    proxy_pass http://api:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $remote_addr; # overwrite, never trust what the client sent
    add_header X-Content-Type-Options nosniff always;

    # Live events (Server-Sent Events): pass bytes through immediately, keep the stream open.
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 1h;
  }

  # The model gateway, for Seyl's devices (OpenCode CLI, OpenWork desktop) with a per-user key
  # from "Connect a device". ONLY the inference routes are published; LiteLLM's admin, key,
  # team, UI and SSO routes are never reachable from outside.
  location = /llm/v1/chat/completions {
    proxy_pass http://litellm:4000/v1/chat/completions;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Cookie ""; # the gateway needs the bearer key, never the browser's session
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_buffering off; # stream tokens as they come
    proxy_read_timeout 10m;
  }
  location = /llm/v1/models {
    proxy_pass http://litellm:4000/v1/models;
    proxy_set_header Cookie "";
    proxy_set_header X-Forwarded-For $remote_addr;
  }
  location = /llm/v1/embeddings {
    proxy_pass http://litellm:4000/v1/embeddings;
    proxy_set_header Cookie "";
    proxy_set_header X-Forwarded-For $remote_addr;
  }
  location ^~ /llm/ {
    return 404;
  }

  # Seyl's document tools (MCP) for connected devices, each with its own revocable token. The
  # harness's internal token is not accepted here (server/mcp.ts); this exact path only.
  location = /mcp {
    proxy_pass http://api:3000/mcp;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Cookie "";
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_buffering off;
    proxy_read_timeout 5m;
  }

  # Keycloak: only what users need — the seyl realm (login page, OIDC endpoints) and its
  # static files. The admin console and the admin ("master") realm are NOT published here:
  # admin tools reach Keycloak directly (port-forward / localhost:8081; scripts/lib/keycloak-admin.ts).
  location ~ ^/auth/(realms/seyl|resources)/ {
    proxy_pass http://keycloak:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $remote_addr; # overwrite: Keycloak decides "local or not" from it
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_buffer_size 128k; # Keycloak sends large headers (cookies)
    proxy_buffers 4 256k;
  }
  location /auth/ {
    return 404;
  }

  # Hashed build assets never change: cache them for a long time.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header X-Content-Type-Options nosniff always;
  }

  # Single-page app: unknown paths get index.html.
  # Security headers: the page may only load its own code (limits what an injected script
  # could do), can't be framed by other sites (clickjacking), and leaks no referrer.
  location / {
    try_files $uri /index.html;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'self'" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
  }
}
