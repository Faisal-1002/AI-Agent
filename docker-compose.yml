# Run the whole stack in containers:   docker compose up --build -d   then   npm run gateway:keys
# Then open http://localhost:8080
# Secrets come from .env (git-ignored; see .env.example) — Compose substitutes ${...} from it.
# Ollama stays on your PC (it needs the GPU); the gateway reaches it via host.docker.internal.
# Just the model side (for `npm run dev`):   docker compose up -d litellm

services:
  harness:
    build: { context: ., dockerfile: deploy/app.Dockerfile }
    image: seyl-ai/app:dev
    command: ["node", "--import", "tsx", "server/harness.ts"]
    environment:
      LLM_GATEWAY_URL: http://litellm:4000
      LITELLM_KEY_HARNESS: ${LITELLM_KEY_HARNESS}
      SEYL_MCP_URL: http://api:3001/mcp # the api's MCP tool server (its own port, not published)
      SEYL_MCP_TOKEN: ${SEYL_MCP_TOKEN}
    volumes:
      - opencode-data:/data # sessions survive restarts
      - workspace:/workspace # files the agent may edit (Docker seeds it from the image the first time)
    depends_on: [litellm]
    # Not published to the PC: only other containers can talk to the harness.

  api:
    image: seyl-ai/app:dev
    environment:
      OPENCODE_URL: http://harness:4097
      LLM_GATEWAY_URL: http://litellm:4000
      LITELLM_KEY_API: ${LITELLM_KEY_API}
      SEYL_DB_HOST: db
      SEYL_DB_PASSWORD: ${SEYL_DB_PASSWORD}
      SEYL_MCP_TOKEN: ${SEYL_MCP_TOKEN}
      AUTH_ENABLED: "true"
      SEYL_PUBLIC_URL: http://localhost:8080
      OIDC_INTERNAL_ISSUER: http://keycloak:8080/auth/realms/seyl
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET}
      SEYL_SESSION_SECRET: ${SEYL_SESSION_SECRET}
    depends_on: [harness]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/readyz').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 5

  web:
    build: { context: ., dockerfile: deploy/web.Dockerfile }
    image: seyl-ai/web:dev
    ports: ["127.0.0.1:8080:80"] # this PC only — not other devices on the network
    depends_on: [api, keycloak] # nginx proxies /api and /auth to them

  # ── Model side ────────────────────────────────────────────────────────────

  # LiteLLM gateway: the only way to reach a model. Admin UI: http://localhost:4000/ui
  # (user "admin", password = LITELLM_MASTER_KEY). Published on localhost only.
  litellm:
    build: gateway # LiteLLM + gateway/config.yaml baked in
    image: seyl-ai/gateway:dev
    environment:
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY}
      LITELLM_SALT_KEY: ${LITELLM_SALT_KEY}
      DATABASE_URL: postgresql://litellm:${POSTGRES_PASSWORD}@db:5432/litellm
      OLLAMA_API_BASE: http://host.docker.internal:11434/v1
      ASR_API_BASE: http://asr:8000/v1
      TTS_API_BASE: http://tts:8000/v1
    extra_hosts: ["host.docker.internal:host-gateway"]
    ports: ["127.0.0.1:4000:4000"]
    depends_on:
      db: { condition: service_healthy }

  # Keycloak: login page, users, OIDC tokens. Reached by browsers via nginx at /auth.
  # start-dev = plain HTTP and relaxed checks: fine on localhost, not for production.
  keycloak:
    build: { context: ., dockerfile: deploy/keycloak.Dockerfile } # + seyl-ai's login theme
    image: seyl-ai/keycloak:dev
    command: ["start-dev"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
      KC_HOSTNAME: http://localhost:8080/auth # the public address tokens are issued for
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true" # the api may call it as keycloak:8080
      KC_HOSTNAME_ADMIN: http://localhost:8081/auth # admin console: here only, not through the app
      KC_HTTP_RELATIVE_PATH: /auth
      KC_PROXY_HEADERS: xforwarded
    ports: ["127.0.0.1:8081:8080"] # admin console + admin API for scripts (this PC only)
    depends_on:
      db: { condition: service_healthy }

  # Postgres (with pgvector): the gateway's keys and logs, and seyl-ai's documents + vectors
  # (separate databases and users; npm run db:setup). Published on localhost for npm run dev.
  db:
    image: pgvector/pgvector:0.8.6-pg16-trixie # same Debian as the data was created on (collation!)
    environment:
      POSTGRES_DB: litellm
      POSTGRES_USER: litellm
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports: ["127.0.0.1:5432:5432"]
    volumes:
      - gateway-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d litellm -U litellm"]
      interval: 2s
      retries: 15

  # Speech-to-text (Qwen3-ASR 0.6B, CPU). Only the gateway talks to it.
  asr:
    build: { context: voice, dockerfile: asr/Dockerfile } # context: voice/ for the shared lazy_model.py
    image: seyl-ai/asr:dev
    volumes:
      - asr-models:/models # model weights, downloaded once

  # Text-to-speech (Qwen3-TTS 0.6B, CPU). Only the gateway talks to it.
  tts:
    build: { context: voice, dockerfile: tts/Dockerfile }
    image: seyl-ai/tts:dev
    volumes:
      - tts-models:/models

volumes:
  opencode-data:
  workspace:
  gateway-db:
  asr-models:
  tts-models:
