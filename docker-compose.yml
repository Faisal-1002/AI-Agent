# Run the whole stack in containers:   docker compose up --build -d   then   npm run gateway:keys
# Then open http://localhost:8080
# Secrets come from .env (git-ignored; see .env.example) — Compose substitutes ${...} from it.
# Ollama stays on your PC (it needs the GPU); the gateway reaches it via host.docker.internal.
# Just the model side (for `npm run dev`):   docker compose up -d litellm

services:
  harness:
    build: { context: ., dockerfile: deploy/app.Dockerfile }
    image: seyl-ai/app:dev
    command: ["node", "--import", "tsx", "server/harness.ts"]
    environment:
      LLM_GATEWAY_URL: http://litellm:4000
      LITELLM_KEY_HARNESS: ${LITELLM_KEY_HARNESS}
      SEYL_API_URL: http://api:3000 # the api's MCP tool server
      SEYL_MCP_TOKEN: ${SEYL_MCP_TOKEN}
    volumes:
      - opencode-data:/data # sessions survive restarts
    depends_on: [litellm]
    # Not published to the PC: only other containers can talk to the harness.

  api:
    image: seyl-ai/app:dev
    environment:
      OPENCODE_URL: http://harness:4097
      LLM_GATEWAY_URL: http://litellm:4000
      LITELLM_KEY_API: ${LITELLM_KEY_API}
      SEYL_DB_HOST: db
      SEYL_DB_PASSWORD: ${SEYL_DB_PASSWORD}
      SEYL_MCP_TOKEN: ${SEYL_MCP_TOKEN}
    depends_on: [harness]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/readyz').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 5

  web:
    build: { context: ., dockerfile: deploy/web.Dockerfile }
    image: seyl-ai/web:dev
    ports: ["8080:80"]
    depends_on: [api]

  # ── Model side ────────────────────────────────────────────────────────────

  # LiteLLM gateway: the only way to reach a model. Admin UI: http://localhost:4000/ui
  # (user "admin", password = LITELLM_MASTER_KEY). Published on localhost only.
  litellm:
    build: gateway # LiteLLM + gateway/config.yaml baked in
    image: seyl-ai/gateway:dev
    environment:
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY}
      LITELLM_SALT_KEY: ${LITELLM_SALT_KEY}
      DATABASE_URL: postgresql://litellm:${POSTGRES_PASSWORD}@db:5432/litellm
      OLLAMA_API_BASE: http://host.docker.internal:11434/v1
      ASR_API_BASE: http://asr:8000/v1
      TTS_API_BASE: http://tts:8000/v1
    extra_hosts: ["host.docker.internal:host-gateway"]
    ports: ["127.0.0.1:4000:4000"]
    depends_on:
      db: { condition: service_healthy }

  # Postgres (with pgvector): the gateway's keys and logs, and seyl-ai's documents + vectors
  # (separate databases and users; npm run db:setup). Published on localhost for npm run dev.
  db:
    image: pgvector/pgvector:0.8.6-pg16-trixie # same Debian as the data was created on (collation!)
    environment:
      POSTGRES_DB: litellm
      POSTGRES_USER: litellm
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports: ["127.0.0.1:5432:5432"]
    volumes:
      - gateway-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d litellm -U litellm"]
      interval: 2s
      retries: 15

  # Speech-to-text (Qwen3-ASR 0.6B, CPU). Only the gateway talks to it.
  asr:
    build: voice/asr
    image: seyl-ai/asr:dev
    volumes:
      - asr-models:/models # model weights, downloaded once

  # Text-to-speech (Qwen3-TTS 0.6B, CPU). Only the gateway talks to it.
  tts:
    build: voice/tts
    image: seyl-ai/tts:dev
    volumes:
      - tts-models:/models

volumes:
  opencode-data:
  gateway-db:
  asr-models:
  tts-models:
